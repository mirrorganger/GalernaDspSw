services:
  galerna-build:
    image: galerna-stm32-build:latest
    build:
      context: .
      dockerfile: Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/workspace
      - /dev/bus/usb:/dev/bus/usb
    working_dir: /workspace
    command: bash
    tty: true
    stdin_open: true
    privileged: true